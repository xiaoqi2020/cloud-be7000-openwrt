name: Auto Sync Upstream Tags

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git 2>/dev/null || true
          git remote -v

      - name: Fetch upstream tags
        run: |
          # 强制拉取上游所有标签，覆盖本地冲突的标签
          git fetch upstream --tags --prune --force

      - name: Sync latest tag
        run: |
          # 获取上游所有标签，按创建时间排序取最新
          LATEST_TAG=$(git tag -l --sort=creatordate | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "上游没有发现任何标签，跳过。"
            exit 0
          fi

          echo "上游最新标签：$LATEST_TAG"

          # 检查本地是否已有
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "标签 $LATEST_TAG 已存在，跳过推送。"
            exit 0
          fi

          # 推送新标签
          git push origin "$LATEST_TAG"
          echo "✅ 已同步标签：$LATEST_TAG"
