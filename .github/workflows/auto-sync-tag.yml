name: Auto Sync Tag from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git
          git fetch upstream --tags --force

      - name: Sync source code from upstream
        run: |
          git checkout main
          git reset --hard upstream/main
          git push origin main --force

      - name: Get latest upstream tag
        id: latest_tag
        run: |
          LATEST_TAG=$(git tag -l --sort=-v:refname | head -n1)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "检测到最新标签: $LATEST_TAG"

      - name: Check if tag exists locally
        id: check_tag
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          if git tag -l "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "标签 $TAG 已存在，跳过创建"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "标签 $TAG 不存在，准备创建"
          fi

      - name: Create tag and release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "自动同步上游 $TAG 版本" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
