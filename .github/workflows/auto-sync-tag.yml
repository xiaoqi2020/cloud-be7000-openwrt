name: Auto Sync Upstream Tags & Release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-tags-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git 2>/dev/null || true
          git remote -v

      - name: Fetch upstream tags
        run: |
          # 强制拉取上游所有标签
          git fetch upstream --tags --prune --force

      - name: Sync latest tag & Create Release
        run: |
          # 获取上游最新标签（按创建时间排序）
          LATEST_TAG=$(git tag -l --sort=creatordate | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "上游没有发现任何标签，跳过。"
            exit 0
          fi

          echo "上游最新标签：$LATEST_TAG"

          # 检查本地是否已有该标签
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "标签 $LATEST_TAG 已存在。"
          else
            # 推送新标签到当前仓库
            git push origin "$LATEST_TAG"
            echo "✅ 已推送标签：$LATEST_TAG"
          fi

          # 检查是否已存在同名 Release
          RELEASE_EXISTS=$(gh release view "$LATEST_TAG" --json tagName --jq '.tagName' 2>/dev/null || echo "")

          if [ "$RELEASE_EXISTS" == "$LATEST_TAG" ]; then
            echo "Release $LATEST_TAG 已存在，跳过创建。"
            exit 0
          fi

          # 创建新 Release
          echo "正在创建 Release: $LATEST_TAG ..."
          gh release create "$LATEST_TAG" \
            --title "Release $LATEST_TAG" \
            --notes "Auto-synced from upstream: timofey-maykov/be7000-openwrt" \
            --target main \
            --verify-tag

          echo "✅ 已创建 Release: $LATEST_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
