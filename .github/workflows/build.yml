name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译的版本标签 (由同步脚本自动传入)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 Release 需要此权限
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }} # ✅ 自动切换到指定的标签版本

      # ==========================================
      # ⬇️ 把你原本的编译步骤粘贴到这里 ⬇️
      # ==========================================
      # 比如：
      # - name: Install Dependencies
      #   run: sudo apt-get update && sudo apt-get install -y build-essential ...
      #
      # - name: Compile Firmware
      #   run: make ...
      # ==========================================
      # ⬆️ 把你原本的编译步骤粘贴到这里 ⬆️
      # ==========================================

      # ✅ 自动去上游获取中文更新说明
      - name: Fetch Chinese Release Notes
        id: notes
        run: |
          # 向上游仓库的 API 请求该标签的 Release 信息
          BODY=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            "https://api.github.com/repos/timofey-maykov/be7000-openwrt/releases/tags/${{ github.event.inputs.tag }}" | jq -r '.body // ""')
          
          # 截取 "更新内容" 及其后面的所有文本（适配上游的格式）
          CHINESE_NOTES=$(echo "$BODY" | sed -n '/更新内容/,$p')
          
          # 如果上游没写或者格式变了，给个兜底说明
          if [ -z "$CHINESE_NOTES" ]; then
            CHINESE_NOTES="同步上游 ${{ github.event.inputs.tag }} 版本。"
          fi
          
          # 使用 GITHUB_OUTPUT 安全传递多行文本给下一步
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHINESE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ✅ 发布 Release 并上传固件
      - name: Create Release and Upload Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          body: ${{ steps.notes.outputs.notes }} # 填入刚刚提取的中文
          # ⚠️ 请把下面的路径换成你编译出来的固件实际所在路径！
          files: |
            bin/targets/*/*/*.bin
            bin/targets/*/*/*.img.gz
          draft: false
          prerelease: false
