name: Upstream Sync & Tag Fetch

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }} # 必须用 PAT_TOKEN，否则不会触发下游 build

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync Code and Tags from Upstream
        run: |
          set -e

          # 0. 备份你自己的自动同步脚本，防止被上游覆盖
          cp .github/workflows/auto-sync.yml /tmp/my-auto-sync.yml || true

          # 1. 记录同步前的本地 Tags
          git tag | grep '^v' | sort > /tmp/old_tags.txt || true

          # 2. 绑定上游并拉取代码和 Tags
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git || true
          git fetch upstream --tags --force

          # 3. 变基上游代码（保持线性历史）
          git rebase upstream/main || {
            echo "::error::Rebase 冲突，请人工介入"
            git diff --name-only --diff-filter=U
            git rebase --abort  # 🟢 修复：rebase 必须用 rebase --abort
            exit 1
          }

          # 4. 恢复你自己的脚本并提交（如果没有变化则跳过）
          mkdir -p .github/workflows
          cp /tmp/my-auto-sync.yml .github/workflows/auto-sync.yml
          git add .github/workflows/auto-sync.yml
          git commit -m "chore: preserve local auto-sync workflow" || echo "no workflow changes"

          # 5. 找出新增的 Tags
          git tag | grep '^v' | sort > /tmp/new_tags.txt || true
          NEW_TAGS=$(comm -13 /tmp/old_tags.txt /tmp/new_tags.txt || true)

          # 6. 如果有新标签，提取中文并写入文件
          if [ -n "$NEW_TAGS" ]; then
            echo "🎉 发现新标签: $NEW_TAGS"
            mkdir -p docs/release-notes
            
            for TAG in $NEW_TAGS; do
              echo "正在处理标签: $TAG"
              # 获取上游 Release 描述
              BODY=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
                "https://api.github.com/repos/timofey-maykov/be7000-openwrt/releases/tags/${TAG}" | jq -r '.body // ""')
              
              # 提取 "更新内容" 及其之后的中文文本
              CHINESE_NOTES=$(echo "$BODY" | sed -n '/更新内容/,$p')
              
              if [ -z "$CHINESE_NOTES" ]; then
                CHINESE_NOTES="同步上游 $TAG 版本。"
              fi
              
              # 写入到上游脚本会去读取的路径
              echo "$CHINESE_NOTES" > "docs/release-notes/${TAG}.md"
              git add "docs/release-notes/${TAG}.md"
            done
            
            # 提交提取的中文说明
            git commit -m "chore: add Chinese release notes for $NEW_TAGS" || echo "no notes to commit"
          fi

          # 7. 推送代码 (包含中文说明文件)
          git push origin main

          # 8. 强制推送标签 (使用 PAT_TOKEN 会自动触发 build.yml)
          git push origin --tags --force
