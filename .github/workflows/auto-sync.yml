name: Upstream Sync & Tag Fetch

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }} # 必须用 PAT_TOKEN

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync Code and Tags from Upstream
        run: |
          set -e

          # 1. 记录同步前的本地 Tags
          git tag | grep '^v' | sort > /tmp/old_tags.txt

          # 2. 绑定上游并拉取代码和 Tags
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git || true
          git fetch upstream --tags --force
          git checkout main

          # 3. 合并上游代码
          git merge upstream/main --allow-unrelated-histories --no-edit || {
            echo "::error::Merge conflict"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          }

          # 4. 找出新增的 Tags
          git tag | grep '^v' | sort > /tmp/new_tags.txt
          NEW_TAGS=$(comm -13 /tmp/old_tags.txt /tmp/new_tags.txt || true)

          # 5. 如果有新标签，提取中文并写入文件
          if [ -n "$NEW_TAGS" ]; then
            echo "🎉 发现新标签: $NEW_TAGS"
            mkdir -p docs/release-notes
            
            for TAG in $NEW_TAGS; do
              echo "正在处理标签: $TAG"
              # 获取上游 Release 描述
              BODY=$(curl -s -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
                "https://api.github.com/repos/timofey-maykov/be7000-openwrt/releases/tags/${TAG}" | jq -r '.body // ""')
              
              # 提取 "更新内容" 及其之后的中文文本
              CHINESE_NOTES=$(echo "$BODY" | sed -n '/更新内容/,$p')
              
              if [ -z "$CHINESE_NOTES" ]; then
                CHINESE_NOTES="同步上游 $TAG 版本。"
              fi
              
              # 写入到上游脚本会去读取的路径
              echo "$CHINESE_NOTES" > "docs/release-notes/${TAG}.md"
              git add "docs/release-notes/${TAG}.md"
            done
            
            # 提交提取的中文说明
            git commit -m "chore: add Chinese release notes for $NEW_TAGS" || echo "no notes to commit"
          fi

          # 6. 推送代码 (包含中文说明文件)
          git push origin main

          # 7. 强制推送标签 (这会自动触发 build.yml)
          # 因为使用的是 PAT_TOKEN 推送，GitHub 会允许级联触发
          git push origin --tags --force
