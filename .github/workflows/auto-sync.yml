name: Upstream Sync & Tag Fetch

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync Code and Tags from Upstream
        run: |
          set -e

          # 备份本地工作流（唯一需要保留的文件）
          cp -r .github/workflows /tmp/local-workflows

          # 绑定上游
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git || true
          git fetch upstream --tags

          git checkout main

          # 合并上游，冲突时明确失败
          git merge upstream/main --allow-unrelated-histories --no-edit || {
            echo "::error::合并冲突，冲突文件："
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          }

          # 合并后强制还原自己的 auto-sync.yml，其他文件保持上游版本
          rm -rf .github/workflows
          cp -r /tmp/local-workflows .github/workflows
          git add .github/workflows
          git commit -m "chore: preserve local auto-sync workflow" || echo "no changes"

          git push origin main

          # ✅ 关键修正：一次性推送所有标签，失败会报错而不是静默忽略
          git push origin --tags
