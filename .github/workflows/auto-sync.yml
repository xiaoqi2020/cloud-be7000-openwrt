name: Upstream Sync & Tag Fetch

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync Code and Tags from Upstream
        run: |
          set -e

          # 备份本地工作流
          cp -r .github/workflows /tmp/local-workflows

          # 绑定上游
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git || true
          
          # 拉取上游标签时强制覆盖本地同名标签
          git fetch upstream --tags --force

          git checkout main

          # 合并上游
          git merge upstream/main --allow-unrelated-histories --no-edit || {
            echo "::error::Merge conflict"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          }

          # 还原自己的工作流文件
          rm -rf .github/workflows
          cp -r /tmp/local-workflows .github/workflows
          git add .github/workflows
          git commit -m "chore: preserve local auto-sync workflow" || echo "no changes"

          git push origin main

          # 强制推送标签
          git push origin --tags --force
