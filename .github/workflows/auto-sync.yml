name: Upstream Sync & Tag Fetch

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # ✅ 必须有这个权限，才能呼叫你的编译脚本

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sync Code and Tags from Upstream
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -e

          # 1. 备份本地工作流 (保护你自己的所有脚本)
          cp -r .github/workflows /tmp/local-workflows

          # 2. 记录同步前的本地 Tags
          git tag | grep '^v' | sort > /tmp/old_tags.txt

          # 3. 绑定上游并拉取代码和 Tags
          git remote add upstream https://github.com/timofey-maykov/be7000-openwrt.git || true
          git fetch upstream --tags --force
          git checkout main

          # 4. 合并上游代码
          git merge upstream/main --allow-unrelated-histories --no-edit || {
            echo "::error::Merge conflict"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          }

          # 5. 还原你自己的 workflow 文件
          rm -rf .github/workflows
          cp -r /tmp/local-workflows .github/workflows
          git add .github/workflows
          git commit -m "chore: preserve local auto-sync workflow" || echo "no changes"

          # 6. 推送代码和 Tags
          git push origin main
          git push origin --tags --force

          # 7. 找出新增的 Tags
          git tag | grep '^v' | sort > /tmp/new_tags.txt
          NEW_TAGS=$(comm -13 /tmp/old_tags.txt /tmp/new_tags.txt || true)

          if [ -z "$NEW_TAGS" ]; then
            echo "✅ 没有发现新标签，同步完成。"
            exit 0
          fi

          # 8. 发现新标签，直接呼叫你的编译工作流
          for TAG in $NEW_TAGS; do
            echo "🎉 发现新标签: $TAG，正在触发编译工作流..."
            # 这里假设你的编译脚本叫 build.yml，并且支持接收 tag 参数
            gh workflow run build.yml -f tag="$TAG"
          done
